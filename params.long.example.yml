# MK Flu-Pipe Nextflow example parameters.
# This example is tuned for a typical Oxford Nanopore long-read run.

input_dir: /path/to/long_fastqs
output_dir: /path/to/long_results
irma_module: FLU-minion
seq_type: long
seq_mode: ""

run_fastqc: true
host_depletion: true
run_ivar: false
run_medaka: true
run_antiviral: true
run_h5_virulence: true
run_fullvarcall: true
run_snpeff: false

adapter_fasta: ""
min_len_short: 75
min_len_long: 200
max_len_long: 0
min_qual: 20
filtlong_min_mean_q: 10
min_coverage: 20
max_n_pct: 10
min_segments: 4

ivar_freq: 0.03
ivar_depth: 10
minority_freq: 0.20
coinfection_pct: 5.0
medaka_env: medaka_env
gisaid_location: ""
gisaid_year: null
metadata_csv: ""
run_phylogeny: false
phylogeny_context_fasta: ""
phylogeny_context_metadata: ""
phylogeny_min_sequences: 3
phylogeny_threads: 4

run_legacy_bridge: false
legacy_script: ""

max_cpus: null
max_memory: null
queue_size: 4
fastqc_threads: 2
fastp_threads: 2
host_depletion_threads: 2
irma_threads: 4
fastp_max_forks: 2
fastp_timeout: 1800
fastp_startup_timeout: 300
host_depletion_max_forks: 2
irma_max_forks: 2

mk_flu_docker_image: mk-flu-pipe/mk_flu_tools:local
medaka_docker_image: mk-flu-pipe/medaka_tools:local
irma_docker_image: cdcgov/irma:v1.3.2
container_registry: ghcr.io/nascimento-jean
container_tag: latest
