name: Tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-tests:
    name: Python and schema smoke tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate schema and Python entry points
        run: |
          python -m json.tool nextflow_schema.json > /tmp/mkflupipe_schema.json
          python -m py_compile bin/discover_samples.py bin/validate_metadata.py bin/run_phylogeny.py bin/run_surveillance_outputs.py
          python tests/check_discover_samples.py
          python tests/check_metadata.py
          python tests/check_phylogeny.py
          python tests/check_light_integration.py
          python tests/check_surveillance_outputs.py

  nextflow-validation:
    name: Nextflow parameter validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Nextflow
        run: |
          curl -s https://get.nextflow.io | bash
          sudo mv nextflow /usr/local/bin/
          nextflow -version

      - name: Reject missing input directory
        run: |
          set +e
          nextflow run main.nf \
            -profile linux,docker \
            --input_dir /tmp/mkflupipe_missing_input \
            --output_dir tests/output/missing-input \
            --irma_module FLU-utr \
            --seq_type short \
            > tests/output_missing_input.log 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -q "Input directory does not exist" tests/output_missing_input.log

      - name: Reject invalid long-read IRMA module
        run: |
          set +e
          nextflow run main.nf \
            -profile linux,docker \
            --input_dir tests/data/long_single \
            --output_dir tests/output/invalid-long-module \
            --irma_module FLU-utr \
            --seq_type long \
            --run_antiviral false \
            > tests/output_invalid_long_module.log 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -q "Long-read runs require --irma_module FLU-minion" tests/output_invalid_long_module.log

      - name: Reject long-read antiviral analysis without Medaka
        run: |
          set +e
          nextflow run main.nf \
            -profile linux,docker \
            --input_dir tests/data/long_single \
            --output_dir tests/output/invalid-long-antiviral \
            --irma_module FLU-minion \
            --seq_type long \
            --run_antiviral true \
            --run_medaka false \
            > tests/output_invalid_long_antiviral.log 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -q "requires --run_medaka true" tests/output_invalid_long_antiviral.log

  nf-test:
    name: nf-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Nextflow
        run: |
          curl -s https://get.nextflow.io | bash
          sudo mv nextflow /usr/local/bin/
          nextflow -version

      - name: Install nf-test
        run: |
          curl -fsSL https://get.nf-test.com | bash
          sudo mv nf-test /usr/local/bin/
          nf-test version

      - name: Run nf-test suite
        run: |
          mkdir -p test-results
          NXF_HOME="$RUNNER_TEMP/nextflow-nf-test" nf-test test tests/nf-test --ci --junitxml test-results/nf-test.xml
