name: Publish container packages

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  publish-ghcr:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: mk-flupipe-nf-mk-flu-tools
            context: ./containers/mk_flu_tools
          - image_name: mk-flupipe-nf-medaka-tools
            context: ./containers/medaka_tools

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Define image path
        id: image
        shell: bash
        run: |
          owner_lc=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "path=ghcr.io/${owner_lc}/${{ matrix.image_name }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.path }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}},enable=${{ github.ref_type == 'tag' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.ref_type == 'tag' }}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' || github.ref_name == github.event.repository.default_branch }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Define optional Docker Hub image path
        id: dockerhub_image
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_NAMESPACE: ${{ secrets.DOCKERHUB_NAMESPACE }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          namespace="${DOCKERHUB_NAMESPACE:-$DOCKERHUB_USERNAME}"
          namespace_lc=$(echo "$namespace" | tr '[:upper:]' '[:lower:]')
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "path=${namespace_lc}/${{ matrix.image_name }}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        if: steps.dockerhub_image.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate Docker Hub metadata
        if: steps.dockerhub_image.outputs.enabled == 'true'
        id: dockerhub_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.dockerhub_image.outputs.path }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}},enable=${{ github.ref_type == 'tag' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.ref_type == 'tag' }}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' || github.ref_name == github.event.repository.default_branch }}

      - name: Build and publish optional Docker Hub image
        if: steps.dockerhub_image.outputs.enabled == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.dockerhub_meta.outputs.tags }}
          labels: ${{ steps.dockerhub_meta.outputs.labels }}
