<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920">
  <defs>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #12284c; }
      .subtitle { font: 500 18px Arial, sans-serif; fill: #334155; }
      .section { font: 700 18px Arial, sans-serif; fill: #0f172a; }
      .label { font: 600 14px Arial, sans-serif; fill: #0f172a; }
      .small { font: 500 13px Arial, sans-serif; fill: #334155; }
      .tiny { font: 500 12px Arial, sans-serif; fill: #475569; }
      .box { fill: #ffffff; stroke: #1e293b; stroke-width: 2; rx: 18; ry: 18; }
      .soft { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; rx: 18; ry: 18; }
      .short { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; rx: 16; ry: 16; }
      .long { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; rx: 16; ry: 16; }
      .shared { fill: #fef3c7; stroke: #d97706; stroke-width: 2; rx: 16; ry: 16; }
      .output { fill: #ede9fe; stroke: #7c3aed; stroke-width: 2; rx: 16; ry: 16; }
      .arrowShared { stroke: #d97706; stroke-width: 5; fill: none; marker-end: url(#arrowShared); }
    </style>
    <marker id="arrowShared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="920" fill="#ffffff"/>

  <text x="800" y="55" text-anchor="middle" class="title">MK Flu-Pipe Nextflow Workflow</text>
  <text x="800" y="85" text-anchor="middle" class="subtitle">Influenza short-read and long-read analysis with Docker or Singularity / Apptainer</text>

  <rect x="40" y="135" width="220" height="165" class="box"/>
  <text x="150" y="175" text-anchor="middle" class="section">Input</text>
  <text x="150" y="220" text-anchor="middle" class="label">FASTQ / FASTQ.GZ</text>
  <text x="150" y="252" text-anchor="middle" class="small">Paired-end short reads</text>
  <text x="150" y="276" text-anchor="middle" class="small">Single-end long reads</text>

  <rect x="320" y="135" width="300" height="165" class="soft"/>
  <text x="470" y="175" text-anchor="middle" class="section">Planning</text>
  <text x="470" y="222" text-anchor="middle" class="label">DISCOVER_SAMPLES</text>
  <text x="470" y="250" text-anchor="middle" class="label">PLAN_RUN</text>
  <text x="470" y="278" text-anchor="middle" class="small">layout, sample IDs, seq_type</text>

  <rect x="680" y="118" width="460" height="220" class="soft"/>
  <text x="910" y="160" text-anchor="middle" class="section">Experiment Routes</text>

  <rect x="720" y="195" width="390" height="60" class="short"/>
  <text x="915" y="230" text-anchor="middle" class="label">Short reads: FastQC -> fastp -> Bowtie2 host depletion</text>

  <rect x="720" y="270" width="390" height="60" class="long"/>
  <text x="915" y="305" text-anchor="middle" class="label">Long reads: FastQC -> Filtlong -> minimap2 host depletion</text>

  <rect x="1180" y="135" width="210" height="165" class="box"/>
  <text x="1285" y="175" text-anchor="middle" class="section">Assembly</text>
  <text x="1285" y="220" text-anchor="middle" class="label">IRMA</text>
  <text x="1285" y="248" text-anchor="middle" class="small">Short: FLU / FLU-utr</text>
  <text x="1285" y="272" text-anchor="middle" class="small">Long: FLU-minion</text>

  <rect x="1440" y="118" width="140" height="220" class="output"/>
  <text x="1510" y="160" text-anchor="middle" class="section">Core</text>
  <text x="1510" y="185" text-anchor="middle" class="section">outputs</text>
  <text x="1510" y="228" text-anchor="middle" class="label">IRMA runs</text>
  <text x="1510" y="258" text-anchor="middle" class="label">assembly_final</text>
  <text x="1510" y="288" text-anchor="middle" class="label">segments</text>
  <text x="1510" y="318" text-anchor="middle" class="tiny">degenerate bases -> N</text>

  <path d="M260 218 L320 218" class="arrowShared"/>
  <path d="M620 218 L680 218" class="arrowShared"/>
  <path d="M1140 238 L1180 238" class="arrowShared"/>
  <path d="M1390 238 L1440 238" class="arrowShared"/>
  <path d="M1285 300 L1285 390" class="arrowShared"/>

  <rect x="80" y="390" width="1440" height="250" class="shared"/>
  <text x="800" y="425" text-anchor="middle" class="section">Shared downstream analyses</text>

  <rect x="120" y="455" width="150" height="115" class="box"/>
  <text x="195" y="488" text-anchor="middle" class="label">Segments + QC</text>
  <text x="195" y="513" text-anchor="middle" class="small">segment extraction</text>
  <text x="195" y="535" text-anchor="middle" class="small">assembly QC</text>
  <text x="195" y="557" text-anchor="middle" class="small">depth summary</text>

  <rect x="290" y="455" width="150" height="115" class="box"/>
  <text x="365" y="488" text-anchor="middle" class="label">BLAST typing</text>
  <text x="365" y="513" text-anchor="middle" class="small">HA / NA typing</text>
  <text x="365" y="535" text-anchor="middle" class="small">classification source</text>

  <rect x="460" y="455" width="150" height="115" class="box"/>
  <text x="535" y="488" text-anchor="middle" class="label">Nextclade</text>
  <text x="535" y="513" text-anchor="middle" class="small">dataset selection</text>
  <text x="535" y="535" text-anchor="middle" class="small">clade and QC</text>

  <rect x="630" y="455" width="170" height="115" class="box"/>
  <text x="715" y="488" text-anchor="middle" class="label">Canonical calling</text>
  <text x="715" y="513" text-anchor="middle" class="small">iVar for short reads</text>
  <text x="715" y="535" text-anchor="middle" class="small">Medaka for long reads</text>

  <rect x="820" y="455" width="170" height="115" class="box"/>
  <text x="905" y="488" text-anchor="middle" class="label">Antiviral resistance</text>
  <text x="905" y="513" text-anchor="middle" class="small">canonical refs</text>
  <text x="905" y="535" text-anchor="middle" class="small">WHO / FluSurver markers</text>

  <rect x="1010" y="455" width="170" height="115" class="box"/>
  <text x="1095" y="488" text-anchor="middle" class="label">H5 virulence</text>
  <text x="1095" y="513" text-anchor="middle" class="small">conditional on H5</text>
  <text x="1095" y="535" text-anchor="middle" class="small">PB2 / PA / PB1 / NS1</text>

  <rect x="1200" y="455" width="170" height="115" class="box"/>
  <text x="1285" y="488" text-anchor="middle" class="label">Step 10b</text>
  <text x="1285" y="513" text-anchor="middle" class="small">RefSeq NC_* + GFF3</text>
  <text x="1285" y="535" text-anchor="middle" class="small">protein mutations</text>

  <rect x="1390" y="455" width="90" height="115" class="box"/>
  <text x="1435" y="488" text-anchor="middle" class="label">MultiQC</text>
  <text x="1435" y="513" text-anchor="middle" class="small">QC report</text>
  <text x="1435" y="535" text-anchor="middle" class="small">aggregation</text>

  <rect x="120" y="700" width="1360" height="165" class="soft"/>
  <text x="800" y="735" text-anchor="middle" class="section">Final reporting</text>

  <rect x="170" y="760" width="260" height="70" class="output"/>
  <text x="300" y="790" text-anchor="middle" class="label">Coinfection report</text>
  <text x="300" y="815" text-anchor="middle" class="small">subtype mixing alerts per sample</text>

  <rect x="470" y="760" width="340" height="70" class="output"/>
  <text x="640" y="790" text-anchor="middle" class="label">Surveillance dashboard</text>
  <text x="640" y="815" text-anchor="middle" class="small">HTML, TSV, JSON, MultiQC copy, summaries</text>

  <rect x="850" y="760" width="300" height="70" class="output"/>
  <text x="1000" y="790" text-anchor="middle" class="label">Consensus outputs</text>
  <text x="1000" y="815" text-anchor="middle" class="small">multisample_consensus.fasta and typing tables</text>

  <rect x="1190" y="760" width="240" height="70" class="output"/>
  <text x="1310" y="790" text-anchor="middle" class="label">Protein mutations</text>
  <text x="1310" y="815" text-anchor="middle" class="small">all_samples_protein_mutations.tsv</text>

  <path d="M1285 640 L1285 700" class="arrowShared"/>

  <text x="800" y="895" text-anchor="middle" class="tiny">Container labels: irma_tools / mk_flu_tools / medaka_tools | Profiles: linux,docker and linux,singularity</text>
</svg>