<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="880" viewBox="0 0 1600 880">
  <defs>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #12284c; }
      .subtitle { font: 500 18px Arial, sans-serif; fill: #334155; }
      .section { font: 700 18px Arial, sans-serif; fill: #0f172a; }
      .label { font: 600 14px Arial, sans-serif; fill: #0f172a; }
      .small { font: 500 13px Arial, sans-serif; fill: #334155; }
      .tiny { font: 500 12px Arial, sans-serif; fill: #475569; }
      .box { fill: #ffffff; stroke: #1e293b; stroke-width: 2; rx: 18; ry: 18; }
      .soft { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; rx: 18; ry: 18; }
      .short { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; rx: 16; ry: 16; }
      .long { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; rx: 16; ry: 16; }
      .shared { fill: #fef3c7; stroke: #d97706; stroke-width: 2; rx: 16; ry: 16; }
      .output { fill: #ede9fe; stroke: #7c3aed; stroke-width: 2; rx: 16; ry: 16; }
      .arrowShort { stroke: #2563eb; stroke-width: 5; fill: none; marker-end: url(#arrowShort); }
      .arrowLong { stroke: #16a34a; stroke-width: 5; fill: none; marker-end: url(#arrowLong); }
      .arrowShared { stroke: #d97706; stroke-width: 5; fill: none; marker-end: url(#arrowShared); }
    </style>
    <marker id="arrowShort" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowLong" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="arrowShared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="880" fill="#ffffff"/>

  <text x="800" y="55" text-anchor="middle" class="title">MK Flu-Pipe Nextflow Workflow</text>
  <text x="800" y="85" text-anchor="middle" class="subtitle">Short-read and long-read Influenza analysis with Docker or Singularity</text>

  <rect x="40" y="135" width="220" height="165" class="box"/>
  <text x="150" y="175" text-anchor="middle" class="section">Input</text>
  <text x="150" y="220" text-anchor="middle" class="label">FASTQ / FASTQ.GZ</text>
  <text x="150" y="252" text-anchor="middle" class="small">Paired-end short reads</text>
  <text x="150" y="276" text-anchor="middle" class="small">Single-end long reads</text>

  <rect x="320" y="135" width="300" height="165" class="soft"/>
  <text x="470" y="175" text-anchor="middle" class="section">Planning</text>
  <text x="470" y="222" text-anchor="middle" class="label">DISCOVER_SAMPLES</text>
  <text x="470" y="250" text-anchor="middle" class="label">PLAN_RUN</text>
  <text x="470" y="278" text-anchor="middle" class="small">Layout, sample IDs, seq_type</text>

  <rect x="680" y="118" width="460" height="220" class="soft"/>
  <text x="910" y="160" text-anchor="middle" class="section">Experiment Routes</text>

  <rect x="720" y="195" width="390" height="60" class="short"/>
  <text x="915" y="230" text-anchor="middle" class="label">Short reads: FastQC → fastp → Bowtie2 host depletion</text>

  <rect x="720" y="270" width="390" height="60" class="long"/>
  <text x="915" y="305" text-anchor="middle" class="label">Long reads: FastQC → Filtlong → minimap2 host depletion</text>

  <rect x="1180" y="135" width="210" height="165" class="box"/>
  <text x="1285" y="175" text-anchor="middle" class="section">Assembly</text>
  <text x="1285" y="220" text-anchor="middle" class="label">IRMA</text>
  <text x="1285" y="248" text-anchor="middle" class="small">Short: FLU / FLU-utr</text>
  <text x="1285" y="272" text-anchor="middle" class="small">Long: FLU-minion</text>

  <rect x="1440" y="118" width="140" height="220" class="output"/>
  <text x="1510" y="160" text-anchor="middle" class="section">Core</text>
  <text x="1510" y="185" text-anchor="middle" class="section">outputs</text>
  <text x="1510" y="228" text-anchor="middle" class="label">IRMA runs</text>
  <text x="1510" y="258" text-anchor="middle" class="label">assembly_final</text>
  <text x="1510" y="288" text-anchor="middle" class="label">segments</text>
  <text x="1510" y="318" text-anchor="middle" class="tiny">Degenerate</text>
  <text x="1510" y="334" text-anchor="middle" class="tiny">bases → N</text>

  <path d="M260 218 L320 218" class="arrowShared"/>
  <path d="M620 218 L680 218" class="arrowShared"/>
  <path d="M1140 238 L1180 238" class="arrowShared"/>
  <path d="M1390 238 L1440 238" class="arrowShared"/>
  <path d="M1285 300 L1285 390" class="arrowShared"/>

  <rect x="120" y="390" width="1360" height="220" class="shared"/>
  <text x="800" y="425" text-anchor="middle" class="section">Shared downstream analyses</text>

  <rect x="160" y="455" width="170" height="105" class="box"/>
  <text x="245" y="488" text-anchor="middle" class="label">Assembly QC</text>
  <text x="245" y="513" text-anchor="middle" class="small">segment extraction</text>
  <text x="245" y="535" text-anchor="middle" class="small">depth summary</text>

  <rect x="360" y="455" width="170" height="105" class="box"/>
  <text x="445" y="488" text-anchor="middle" class="label">BLAST typing</text>
  <text x="445" y="513" text-anchor="middle" class="small">HA / NA subtype</text>
  <text x="445" y="535" text-anchor="middle" class="small">classification source</text>

  <rect x="560" y="455" width="170" height="105" class="box"/>
  <text x="645" y="488" text-anchor="middle" class="label">Nextclade</text>
  <text x="645" y="513" text-anchor="middle" class="small">dataset auto-selection</text>
  <text x="645" y="535" text-anchor="middle" class="small">clade and QC</text>

  <rect x="760" y="455" width="170" height="105" class="box"/>
  <text x="845" y="488" text-anchor="middle" class="label">Canonical calls</text>
  <text x="845" y="513" text-anchor="middle" class="small">iVar (short)</text>
  <text x="845" y="535" text-anchor="middle" class="small">Medaka (long)</text>

  <rect x="960" y="455" width="170" height="105" class="box"/>
  <text x="1045" y="488" text-anchor="middle" class="label">Antiviral resistance</text>
  <text x="1045" y="513" text-anchor="middle" class="small">canonical refs</text>
  <text x="1045" y="535" text-anchor="middle" class="small">flu_antiviral_markers</text>

  <rect x="1160" y="455" width="170" height="105" class="box"/>
  <text x="1245" y="488" text-anchor="middle" class="label">H5 virulence</text>
  <text x="1245" y="513" text-anchor="middle" class="small">conditional on H5</text>
  <text x="1245" y="535" text-anchor="middle" class="small">PB2 / PA / PB1 / NS1</text>

  <rect x="1360" y="455" width="90" height="105" class="box"/>
  <text x="1405" y="488" text-anchor="middle" class="label">Step 10b</text>
  <text x="1405" y="513" text-anchor="middle" class="small">RefSeq</text>
  <text x="1405" y="535" text-anchor="middle" class="small">+ GFF3</text>

  <rect x="120" y="670" width="1360" height="150" class="soft"/>
  <text x="800" y="705" text-anchor="middle" class="section">Final reporting</text>

  <rect x="180" y="730" width="240" height="65" class="output"/>
  <text x="300" y="758" text-anchor="middle" class="label">Coinfection / subtype mixing</text>
  <text x="300" y="782" text-anchor="middle" class="small">segment-level alerts</text>

  <rect x="470" y="730" width="300" height="65" class="output"/>
  <text x="620" y="758" text-anchor="middle" class="label">Surveillance Outputs</text>
  <text x="620" y="782" text-anchor="middle" class="small">HTML, TSV, FASTA, JSON, run summary</text>

  <rect x="820" y="730" width="300" height="65" class="output"/>
  <text x="970" y="758" text-anchor="middle" class="label">GISAID-ready outputs</text>
  <text x="970" y="782" text-anchor="middle" class="small">metadata + consensus FASTA</text>

  <rect x="1170" y="730" width="250" height="65" class="output"/>
  <text x="1295" y="758" text-anchor="middle" class="label">Protein mutations</text>
  <text x="1295" y="782" text-anchor="middle" class="small">all_samples_protein_mutations.tsv</text>

  <path d="M1285 610 L1285 670" class="arrowShared"/>

  <text x="800" y="850" text-anchor="middle" class="tiny">Docker labels: irma_tools / mk_flu_tools / medaka_tools • Profiles: linux,docker and linux,singularity</text>
</svg>